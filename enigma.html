<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U.S. ARMY // ENIGMA-100 TAC-SYSTEM</title>
    <style>
        :root {
            --army-dark: #0f140d;
            --panel-bg: #192017;
            --panel-border: #384832;
            --army-olive: #556b2f;
            --army-tan: #c2b280;
            --army-green-bright: #4caf50;
            --army-red: #d32f2f;
            --text-main: #e0e6df;
            --text-dim: #8b9b85;
            --font-tactical: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--army-dark);
            color: var(--text-main);
            font-family: var(--font-tactical);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: 
                radial-gradient(#253320 15%, transparent 16%),
                radial-gradient(#1e291b 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }

        .main-frame {
            width: 100%;
            max-width: 950px;
            background: var(--panel-bg);
            border: 3px solid var(--army-olive);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8), inset 0 0 10px rgba(85, 107, 47, 0.3);
            border-radius: 4px;
            padding: 25px;
            position: relative;
        }

        header {
            border-bottom: 2px solid var(--panel-border);
            padding-bottom: 15px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .star-logo {
            font-size: 1.8rem;
            color: var(--army-tan);
        }

        h1 {
            color: var(--army-tan);
            font-size: 1.4rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .badge-classification {
            background: var(--army-olive);
            color: #000;
            padding: 4px 10px;
            font-weight: bold;
            font-size: 0.75rem;
            letter-spacing: 1px;
            border-radius: 2px;
        }

        .tactical-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .tactical-grid-2col {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 20px;
            }
        }

        .panel-box {
            background: rgba(10, 14, 9, 0.6);
            border: 1px solid var(--panel-border);
            padding: 15px;
            position: relative;
            border-left: 4px solid var(--army-olive);
        }

        .panel-title {
            color: var(--army-tan);
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        input[type="text"], textarea {
            width: 100%;
            background: #090c08;
            border: 1px solid var(--panel-border);
            color: var(--army-green-bright);
            font-family: var(--font-tactical);
            padding: 10px;
            font-size: 0.9rem;
            outline: none;
            transition: border 0.2s;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: var(--army-tan);
        }

        textarea {
            height: 110px;
            resize: vertical;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 120px;
            background: #232c20;
            border: 1px solid var(--army-olive);
            color: var(--army-tan);
            padding: 10px 14px;
            font-family: var(--font-tactical);
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        button:hover {
            background: var(--army-olive);
            color: #fff;
            box-shadow: 0 0 10px rgba(85, 107, 47, 0.5);
        }

        button.btn-primary {
            background: var(--army-olive);
            color: #fff;
            border-color: var(--army-tan);
        }

        button.btn-primary:hover {
            background: var(--army-tan);
            color: #000;
        }

        button.btn-danger {
            border-color: var(--army-red);
            color: var(--army-red);
            background: transparent;
        }

        button.btn-danger:hover {
            background: var(--army-red);
            color: #fff;
        }

        .saved-vault {
            max-height: 130px;
            overflow-y: auto;
            background: #090c08;
            border: 1px solid var(--panel-border);
            margin-top: 10px;
        }

        .vault-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            border-bottom: 1px solid #1a2218;
            font-size: 0.8rem;
        }

        .vault-item:last-child {
            border-bottom: none;
        }

        .vault-item .key-text {
            word-break: break-all;
            color: var(--text-main);
            margin-right: 8px;
        }

        .vault-actions {
            display: flex;
            gap: 4px;
        }

        .vault-actions button {
            padding: 3px 6px;
            font-size: 0.7rem;
            min-width: auto;
        }

        .status-bar {
            margin-top: 20px;
            padding-top: 10px;
            border-top: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #090c08; }
        ::-webkit-scrollbar-thumb { background: var(--army-olive); }
    </style>
</head>
<body>

<div class="main-frame">
    <header>
        <div class="header-title">
            <span class="star-logo">★</span>
            <div>
                <h1>ENIGMA-100 TAC-SYSTEM</h1>
                <div style="font-size: 0.7rem; color: var(--text-dim);">US ARMY SIGNAL CORPS SPECIFICATION</div>
            </div>
        </div>
        <span class="badge-classification">RESTRICTED // NO-ACHILLES ENGINE</span>
    </header>

    <div class="tactical-grid">
        <div class="tactical-grid-2col">
            <div class="panel-box">
                <div class="panel-title">1. Configuración de Semilla / Clave</div>
                <label for="cipherKey">Contraseña o Frase de Cifrado:</label>
                <input type="text" id="cipherKey" placeholder="Introduce la clave secreta..." autocomplete="off">
                <div class="btn-group">
                    <button onclick="generateRandomKey()">Aleatoria</button>
                    <button onclick="saveCurrentKey()">Guardar</button>
                </div>
            </div>

            <div class="panel-box">
                <div class="panel-title">Bóveda de Claves Guardadas</div>
                <div class="saved-vault" id="savedKeysContainer"></div>
            </div>
        </div>

        <div class="panel-box">
            <div class="panel-title">2. Entrada de Mensaje</div>
            <textarea id="inputText" placeholder="Escribe o pega aquí el texto para Cifrar o Desencriptar..."></textarea>
            <div class="btn-group">
                <button onclick="pasteToInput()">Pegar</button>
                <button class="btn-danger" onclick="clearInput()">Limpiar</button>
            </div>
        </div>

        <div class="panel-box" style="border-left-color: var(--army-tan);">
            <div class="panel-title">3. Ejecutar Procesamiento</div>
            <div class="btn-group">
                <button class="btn-primary" onclick="processText()">🔒 Cifrar Mensaje</button>
                <button class="btn-primary" onclick="processText()">🔓 Desencriptar Mensaje</button>
            </div>
        </div>

        <div class="panel-box">
            <div class="panel-title">4. Resultado / Salida</div>
            <textarea id="outputText" readonly placeholder="El texto procesado aparecerá aquí..."></textarea>
            <div class="btn-group">
                <button onclick="copyOutput()">Copiar Resultado</button>
            </div>
        </div>
    </div>

    <div class="status-bar">
        <span>ENGINE STATUS: OPERATIONAL</span>
        <span>ROTORS: 100 ACTIVE</span>
        <span>ACHILLES FIX: ENABLED</span>
    </div>
</div>
